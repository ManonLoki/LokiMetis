# 人工维护 shim：保留运行时依赖与特性；上游完整清单见 upstream/Cargo.toml。
[package]
publish = false
edition = "2021"
rust-version = "1.90"
name = "tray-icon"
version = "0.26.1"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Create tray icons for desktop applications"
homepage = "https://github.com/tauri-apps/tray-icon"
readme = "upstream/README.md"
categories = ["gui"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tauri-apps/tray-icon"

[features]
default = ["libappindicator"]
ksni = [
    "dep:ksni",
    "muda-snapshot",
]
libappindicator = [
    "dep:dirs",
    "dep:libappindicator",
    "muda-gtk3",
]
muda-common-controls-v6 = ["muda/common-controls-v6"]
muda-gtk3 = ["muda/gtk3"]
muda-gtk4 = ["muda/gtk4"]
muda-serde = ["muda/serde"]
muda-snapshot = ["muda/snapshot"]
serde = [
    "dep:serde",
    "muda-serde",
]

[lib]
name = "tray_icon"
path = "src/lib.rs"

[dependencies.crossbeam-channel]
version = "0.5"

[dependencies.muda]
version = "0.21"
default-features = false

[dependencies.once_cell]
version = "1"

[dependencies.serde]
version = "1"
optional = true

[dependencies.thiserror]
version = "2"



[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies.dirs]
version = "7"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies.ksni]
version = "0.3.6"
features = [
    "async-io",
    "blocking",
]
optional = true
default-features = false

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies.libappindicator]
version = "0.9"
optional = true


[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies.png]
version = "0.18"

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
features = [
    "std",
    "objc2-core-foundation",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSEvent",
    "NSImage",
    "NSMenu",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
]
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3.2"
features = [
    "std",
    "CFCGTypes",
    "CFRunLoop",
]
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
version = "0.3.2"
features = [
    "std",
    "CGDirectDisplay",
]
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSArray",
    "NSData",
    "NSEnumerator",
    "NSGeometry",
    "NSString",
    "NSThread",
]
default-features = false

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = ">=0.60, <=0.61"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
]
