name: Native macOS signing preflight

on:
  push:
    branches: [feature-ci-macos-signing-preflight-20261022]

permissions:
  contents: read

jobs:
  macos-signing:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
      - name: Install declared toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-apple-darwin
          npm install --global pnpm@12.4.1
          command -v node pnpm cargo rustc
          node --version
          pnpm --version
          rustc --version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-packager
          key: release-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-packager0.11.8-${{ hashFiles('Cargo.toml') }}
      - name: Install declared packager
        run: pnpm run gpui:package setup --root .
      - name: Import approved signing credentials
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
        run: node scripts/github_macos_credentials.mjs import
      - name: Verify native tests and complete signing pipeline
        run: node scripts/macos_signing_preflight.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mac-native-preflight-receipt
          path: ${{ runner.temp }}/mac-native-probe.json
          if-no-files-found: error
          retention-days: 7
      - name: Delete temporary signing credentials
        if: always()
        run: node scripts/github_macos_credentials.mjs cleanup
