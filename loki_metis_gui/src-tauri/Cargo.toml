[package]
name = "loki_metis_gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "LokiMetis Tauri desktop adapter"

[lib]
name = "loki_metis_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "loki_metis_gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chromiumoxide = { workspace = true }
futures = { workspace = true }
jiff = { workspace = true }
loki_metis_core = { workspace = true }
rust-i18n = { workspace = true }
same-file = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
whichdisk = { workspace = true }
zeroize = { workspace = true }
zip = { workspace = true }

[target.'cfg(unix)'.dependencies]
atomic-write-file = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = { workspace = true }
objc2-foundation = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
windows-permissions = { workspace = true }
wmi = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = { workspace = true }
