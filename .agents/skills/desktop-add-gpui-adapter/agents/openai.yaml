interface:
  display_name: "添加 GPUI 适配器"
  short_description: "为共享核心增加原生 GPUI 壳层、基础依赖与按需桌面能力"
  default_prompt: "使用 $desktop-add-gpui-adapter，为明确选择 GPUI 的 Rust 工作区增加直接依赖 core 的原生薄适配器，复用已确认双语身份和九项 GUI 配置，建立三态主题、系统语言、设置、条件关于/赞助页与精简或详细侧栏，并真实验证关闭最后窗口退出；读取基础依赖标准，按选择接入托盘、通知、自启、单实例和全局快捷键，选完询问配置协助；深链接保持禁用，托盘和后台热键当前限 macOS/Windows。"
