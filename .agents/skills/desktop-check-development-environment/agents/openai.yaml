interface:
  display_name: "检查开发环境"
  short_description: "按需检查并安装或升级 Git 与所选接口的受管开发工具链"
  default_prompt: "仅在项目初始化、用户明确要求 Linux GPUI 工具链，或真实测试/构建命令已因受管环境问题失败后，使用 $desktop-check-development-environment：按适用入口安装缺失工具，升级可证明低于最低下界的工具，复用范围内版本；Linux 专项请求不扩展常规门禁范围。不得降低门禁、回退依赖、注入 shim 或改找替代工具链来迁就旧环境，也不得例行预检。返回适用 gate.git、linux 状态与实际变更。"
