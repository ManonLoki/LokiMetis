[workspace]
resolver = "3"
members = ["loki_metris_core","loki_metris_gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["ManonLoki"]

[workspace.dependencies]
loki_metris_core = { path = "loki_metris_core" }
gpui-kit = "0.7.1"
rust-i18n = "4.2.0"
sys-locale = "0.3.2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
tracing-appender = { version = "0.2.5", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }
auto-launch = "0.6.0"
interprocess = "2.4.4"
global-hotkey = "0.8.0"
raw-window-handle = "0.6.2"

[workspace.metadata.agent-first-harness]
project-id = "loki_metris"
interfaces = ["gui"]
target-platforms = ["windows", "macos"]
gui-framework = "gpui"
