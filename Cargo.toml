[workspace]
resolver = "3"
members = ["loki_metris_core","loki_metris_gui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["ManonLoki"]

[workspace.dependencies]
anyhow = "1.0.102"
uuid = { version = "1.23.1", features = ["v4"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif"] }
png = "0.18.1"
encoding_rs = "0.8.35"
jiff = "0.2.35"
sea-orm = { version = "1.1.20", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.19"
toml = "1.1.3"
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tempfile = "3.27.0"
same-file = "1.0.6"
whichdisk = { version = "0.5.0", default-features = false, features = ["list"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSMetadata", "NSMetadataAttributes", "NSObject", "NSPathUtilities", "NSPredicate", "NSRunLoop", "NSString", "NSUserDefaults", "NSDictionary", "NSValue"] }
windows = { version = "0.61.3", default-features = false, features = ["Foundation", "Storage", "Storage_Search", "Storage_Streams", "Win32_System_Com", "Win32_UI_Shell"] }
loki_metris_core = { path = "loki_metris_core" }
gpui-kit = "0.7.1"
rust-i18n = "4.2.0"
sys-locale = "0.3.2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
tracing-appender = { version = "0.2.5", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }
auto-launch = "0.6.0"
interprocess = "2.4.4"
global-hotkey = "0.8.0"
raw-window-handle = "0.6.2"

[workspace.metadata.agent-first-harness]
project-id = "loki_metris"
interfaces = ["gui"]
target-platforms = ["windows", "macos"]
gui-framework = "gpui"
