[workspace]
resolver = "3"
members = ["loki_metris_pairing","loki_metris_core","loki_metris_host","loki_metris_service","loki_metris_gui","loki_metris_mobile_bridge"]
exclude = ["vendor/accesskit_macos", "vendor/gpui-pre", "vendor/gpui-pre-apple", "vendor/gpui-pre-macos", "vendor/gpui-pre-windows", "vendor/gpui-pre-wgpu", "vendor/tray-icon"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["ManonLoki"]

[workspace.dependencies]
base64 = "0.23.1"
chromiumoxide = "0.9.1"
futures = "0.3.34"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
anyhow = "1.0.104"
uuid = { version = "1.28.0", features = ["v4", "v7"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
png = "0.18.1"
image-webp = "0.2.4"
encoding_rs = "0.8.42"
jiff = "0.2.38"
sea-orm = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = { version = "0.21.6", default-features = false, features = ["async"] }
sha2 = { version = "0.11.1", default-features = false }
spake2 = { version = "=0.4.0", default-features = false, features = ["getrandom"] }
hkdf = { version = "0.13.0", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
loki_metris_pairing = { path = "loki_metris_pairing" }
thiserror = "2.0.21"
toml = "1.1.8"
tokio = { version = "1.53.3", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tempfile = "3.27.0"
same-file = "1.0.6"
whichdisk = { version = "0.7.0", default-features = false, features = ["list"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSMetadata", "NSMetadataAttributes", "NSObject", "NSPathUtilities", "NSPredicate", "NSRunLoop", "NSString", "NSUserDefaults", "NSDictionary", "NSArray", "NSValue", "NSBundle", "NSURL", "NSNotification", "NSOperation", "block2"] }
windows = { version = "0.62.2", default-features = false, features = ["Foundation", "Storage", "Storage_Search", "Storage_Streams", "Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_Packaging_Appx", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_WinRT", "Win32_System_WindowsProgramming", "Data_Xml_Dom", "UI_Notifications"] }
loki_metris_core = { path = "loki_metris_core" }
loki_metris_host = { path = "loki_metris_host" }
loki_metris_service = { path = "loki_metris_service" }
gpui-kit = "0.8.1"
# 现有Apple传递依赖仅供macOS显式开启已验证父圆角能力；
# 源码不直接引用，仅借特性统一启用，删除会静默关闭父圆角裁剪。
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.10", default-features = false }
rust-i18n = "4.2.4"
sys-locale = "0.3.2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
tracing-appender = { version = "0.2.5", default-features = false }
# 本地 HRESULT 修复仅对已核验的原包生效，避免重新解析时绕过同版本补丁。
tray-icon = { version = "=0.26.1", default-features = false }
auto-launch = "0.6.0"
# Linux 读取 XDG 登录项时与 auto-launch 写入使用同一 home 解析（含 passwd 回退）。
dirs = "6.0.0"
interprocess = "2.4.5"
global-hotkey = "0.8.0"
# Linux热键分别使用桌面Portal与可确认注册结果的X11连接，仅由Linux GUI继承。
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
x11rb = { version = "0.13.2", features = ["xkb"] }
raw-window-handle = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSView", "NSScreen", "NSResponder", "NSEvent", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2 = "0.6.5"
block2 = "0.6.2"
libc = "0.2.190"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification"] }

[workspace.metadata.agent-first-harness]
project-id = "loki_metris"
interfaces = ["gui"]
target-platforms = ["windows", "macos", "linux"]
gui-framework = "gpui"

[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
accesskit_macos = { path = "vendor/accesskit_macos" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
